<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1457d9"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #10243e; }
      .subtitle { font: 400 14px Inter, Arial, sans-serif; fill: #64748b; }
      .box-title { font: 700 15px Inter, Arial, sans-serif; fill: #10243e; }
      .box-text { font: 400 12px Inter, Arial, sans-serif; fill: #334155; }
      .box-mono { font: 400 11px ui-monospace, Menlo, Consolas, monospace; fill: #334155; }
      .label { font: 400 11px Inter, Arial, sans-serif; fill: #475569; }
      .section { font: 700 16px Inter, Arial, sans-serif; fill: #10243e; }
      .footer-title { font: 700 13px Inter, Arial, sans-serif; fill: #10243e; }
      .footer-text { font: 400 11px Inter, Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="950" fill="#ffffff"/>
  <text class="title" x="60" y="52">Email Intelligence — hard infrastructure + TaskForge self-integration</text>
  <text class="subtitle" x="60" y="82">Mirrored mailbox · read-only IMAP through the credential gateway · planner-generated workflow · phase-1 Postgres · scheduler + monitoring dashboard</text>

  <!-- Mirror mailbox -->
  <rect x="60" y="140" width="280" height="180" rx="14" fill="#fff4df" stroke="#b45309" stroke-width="1.5"/>
  <text class="box-title" x="80" y="174">Mirror mailbox</text>
  <text class="box-text" x="80" y="202">GreenMail</text>
  <text class="box-mono" x="80" y="224">SMTP :3025</text>
  <text class="box-mono" x="80" y="244">IMAP :3143</text>
  <text class="box-text" x="80" y="272">Seeded INBOX (5 emails)</text>
  <text class="box-text" x="80" y="292">One PDF deck + links</text>
  <text class="label" x="80" y="340">Demo stand-in for the enterprise mirror</text>

  <!-- Credential gateway -->
  <rect x="390" y="155" width="240" height="150" rx="14" fill="#dff7f2" stroke="#0d9488" stroke-width="1.5"/>
  <text class="box-title" x="410" y="188">Credential Gateway :8083</text>
  <text class="box-text" x="410" y="216">· read-only IMAP broker</text>
  <text class="box-text" x="410" y="238">· audit log</text>
  <text class="box-text" x="410" y="260">· human approval path</text>
  <text class="box-text" x="410" y="282">· agent token scoped</text>

  <!-- TaskForge platform -->
  <rect x="690" y="130" width="680" height="350" rx="16" fill="#f8fbff" stroke="#7aa7ff" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="section" x="710" y="160">TaskForge platform</text>

  <rect x="720" y="175" width="180" height="52" rx="10" fill="#e8f0ff" stroke="#1457d9" stroke-width="1.2"/>
  <text class="box-text" x="740" y="199">Studio frontend :3000</text>
  <text class="box-mono" x="740" y="216">user command</text>

  <rect x="930" y="175" width="190" height="52" rx="10" fill="#e8f0ff" stroke="#1457d9" stroke-width="1.2"/>
  <text class="box-text" x="950" y="199">Control plane :8000</text>
  <text class="box-mono" x="950" y="216">planner + DAG API</text>

  <rect x="1150" y="175" width="200" height="52" rx="10" fill="#e8f0ff" stroke="#1457d9" stroke-width="1.2"/>
  <text class="box-text" x="1170" y="199">Temporal :7233 / :8088</text>
  <text class="box-mono" x="1170" y="216">durable execution</text>

  <rect x="720" y="270" width="180" height="58" rx="10" fill="#e8f0ff" stroke="#1457d9" stroke-width="1.2"/>
  <text class="box-text" x="740" y="295">Temporal worker</text>
  <text class="box-mono" x="740" y="313">node orchestration</text>

  <rect x="1150" y="260" width="200" height="86" rx="10" fill="#dff7f2" stroke="#0d9488" stroke-width="1.2"/>
  <text class="box-title" x="1170" y="285" font-size="13">Sandboxed agent</text>
  <text class="box-mono" x="1170" y="305">openclaw-agent:email</text>
  <text class="box-mono" x="1170" y="323">psycopg2 + pypdf</text>
  <text class="box-mono" x="1170" y="341">email_imap skill driver</text>

  <text class="label" x="720" y="408">One user command → planner builds the DAG.</text>
  <text class="label" x="720" y="426">The scheduler never calls the planner.</text>

  <!-- Postgres -->
  <rect x="1400" y="140" width="280" height="300" rx="14" fill="#eef2f7" stroke="#475569" stroke-width="1.5"/>
  <text class="box-title" x="1420" y="174">Phase-1 Postgres</text>
  <text class="box-mono" x="1420" y="196">email_intelligence</text>
  <text class="box-mono" x="1420" y="226">emails</text>
  <text class="box-mono" x="1420" y="246">attachments</text>
  <text class="box-mono" x="1420" y="266">extractions</text>
  <text class="box-mono" x="1420" y="286">scheduler_runs</text>
  <text class="box-mono" x="1420" y="306">settings</text>
  <text class="label" x="1420" y="342">roles</text>
  <text class="box-mono" x="1420" y="362">taskforge_writer (INSERT/UPDATE)</text>
  <text class="box-mono" x="1420" y="382">email_app (read + runs/settings)</text>

  <!-- Scheduler -->
  <rect x="720" y="520" width="300" height="150" rx="14" fill="#e8f0ff" stroke="#1457d9" stroke-width="1.5"/>
  <text class="box-title" x="740" y="552">email-scheduler :8086</text>
  <text class="box-text" x="740" y="580">· interval loop (60s)</text>
  <text class="box-text" x="740" y="602">· instantiate + start target DAG</text>
  <text class="box-text" x="740" y="624">· overlap guard</text>
  <text class="box-text" x="740" y="646">· run history</text>

  <!-- Dashboard -->
  <rect x="1070" y="520" width="300" height="150" rx="14" fill="#dff7f2" stroke="#0d9488" stroke-width="1.5"/>
  <text class="box-title" x="1090" y="552">email-dashboard :8095</text>
  <text class="box-text" x="1090" y="580">nginx static UI</text>
  <text class="box-text" x="1090" y="602">· Overview · Emails</text>
  <text class="box-text" x="1090" y="624">· read-only Kanban</text>
  <text class="box-text" x="1090" y="646">· Runs · Target DAG / Run now</text>

  <!-- Arrows -->
  <line x1="340" y1="230" x2="388" y2="230" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="label" x="352" y="220">IMAP</text>
  <text class="label" x="348" y="244">read-only</text>

  <path d="M 630 230 L 660 230 L 660 250 L 1140 250 L 1140 303 L 1148 303" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="label" x="910" y="270">brokered access</text>
  <text class="label" x="910" y="286">no agent password</text>

  <line x1="1350" y1="303" x2="1398" y2="303" stroke="#0d9488" stroke-width="1.6" marker-end="url(#arrow-teal)"/>

  <path d="M 870 520 L 870 470 L 1025 470 L 1025 229" fill="none" stroke="#1457d9" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text class="label" x="1038" y="430">instantiate + start</text>
  <text class="label" x="1038" y="448">(target DAG id)</text>

  <path d="M 900 520 L 900 500 L 1450 500 L 1450 442" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="label" x="1210" y="490">scheduler_runs + settings</text>

  <line x1="1068" y1="595" x2="1022" y2="595" stroke="#0d9488" stroke-width="1.6" marker-end="url(#arrow-teal)"/>
  <text class="label" x="1035" y="615">read API</text>

  <!-- Footer -->
  <rect x="60" y="740" width="1620" height="120" rx="14" fill="#f8fbff" stroke="#dbe6f1" stroke-width="1.2"/>
  <rect x="90" y="770" width="300" height="64" rx="10" fill="#e8f0ff" stroke="#1457d9" stroke-width="1.2"/>
  <text class="footer-title" x="108" y="796">1  Ingest</text>
  <text class="footer-text" x="108" y="817">read-only IMAP mirror</text>

  <rect x="430" y="770" width="300" height="64" rx="10" fill="#e8f0ff" stroke="#1457d9" stroke-width="1.2"/>
  <text class="footer-title" x="448" y="796">2  Process</text>
  <text class="footer-text" x="448" y="817">PDF parse + LLM extract</text>

  <rect x="770" y="770" width="300" height="64" rx="10" fill="#dff7f2" stroke="#0d9488" stroke-width="1.2"/>
  <text class="footer-title" x="788" y="796">3  Store</text>
  <text class="footer-text" x="788" y="817">phase-1 Postgres</text>

  <rect x="1110" y="770" width="300" height="64" rx="10" fill="#dff7f2" stroke="#0d9488" stroke-width="1.2"/>
  <text class="footer-title" x="1128" y="796">4  Visualize</text>
  <text class="footer-text" x="1128" y="817">dashboard + Kanban</text>

  <text class="footer-text" x="90" y="882">Self-integration in one command: the planner builds the workflow; the scheduler only triggers it; the agent never sees the mailbox password.</text>
</svg>
