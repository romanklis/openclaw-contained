# ---------------------------------------------------------------------------
# picoclaw — Minimal Alpine shell-only (no Python, no Node.js)
# ---------------------------------------------------------------------------
picoclaw:
  notes: >
    Ultra-minimal shell-only agent. Alpine with BusyBox + essential CLI tools.
    No Python or Node.js runtime. Agents must use shell scripts, awk, sed, etc.
    Only system packages (apk) are available.
  pip: []   # NOT AVAILABLE — no Python runtime
  npm: []   # NOT AVAILABLE — no Node.js runtime
  apk:
    - bash
    - coreutils
    - curl
    - wget
    - git
    - jq
    - sed
    - gawk
    - grep
    - findutils
    - tar
    - gzip
    - bzip2
    - xz
    - zip
    - unzip
    - file
    - tree
    - ncurses
    - less
    - openssh-client
    - rsync
    - socat
    - netcat-openbsd
    - bind-tools
    - iputils
    - openssl
    - ca-certificates
    # wkhtmltopdf — NOT available in Alpine repos
    - chromium
    - imagemagick
    - graphviz
    - ffmpeg
    - poppler-utils
    - tesseract-ocr
    - sqlite

