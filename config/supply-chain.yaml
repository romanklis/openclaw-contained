# =============================================================================
# OpenClaw Supply Chain — Approved Packages per Image Type
# =============================================================================
#
# Every package an agent can request MUST be listed here. This file is the
# single source of truth for what is installable in each base image type.
#
# Structure:
#   <image_type>:
#     pip:   [ ... ]        # Python packages (pip install)
#     apt:   [ ... ]        # Debian system packages (apt-get install)
#     apk:   [ ... ]        # Alpine system packages (apk add)
#     npm:   [ ... ]        # Node.js packages (npm install -g)
#     notes: "..."          # Auditor-facing description
#
# Package names use the NATIVE package manager name for each distro.
# Aliases (Debian → Alpine mappings) are in the `aliases` section.
#
# To add a new package:
#   1. Verify it exists in the target repo (apt/apk/pypi)
#   2. Add it below under the correct image type and category
#   3. Commit this file — the git log IS the audit trail
#
# =============================================================================

# ---------------------------------------------------------------------------
# Debian ↔ Alpine package name mapping
# When an agent requests a Debian name on Alpine (or vice-versa), the image
# builder will transparently substitute.
# ---------------------------------------------------------------------------
aliases:
  apt_to_apk:
    # networking
    netcat-openbsd: netcat-openbsd
    iputils-ping: iputils
    dnsutils: bind-tools
    # libs & dev
    libffi-dev: libffi-dev
    libssl-dev: openssl-dev
    libxml2-dev: libxml2-dev
    libxslt1-dev: libxslt-dev
    libjpeg-dev: libjpeg-turbo-dev
    libpng-dev: libpng-dev
    zlib1g-dev: zlib-dev
    libpq-dev: libpq-dev
    default-libmysqlclient-dev: mariadb-dev
    # tools
    wkhtmltopdf: wkhtmltopdf
    chromium-browser: chromium
    chromium: chromium
    imagemagick: imagemagick
    graphviz: graphviz
    tesseract-ocr: tesseract-ocr
    poppler-utils: poppler-utils
    ffmpeg: ffmpeg
    gcc: gcc
    g++: g++
    make: make
    cmake: cmake
    sqlite3: sqlite
    # shells / utils
    bash: bash
    coreutils: coreutils
    jq: jq
    curl: curl
    wget: wget
    git: git

  apk_to_apt:
    # reverse mappings for completeness
    openssl-dev: libssl-dev
    libxslt-dev: libxslt1-dev
    libjpeg-turbo-dev: libjpeg-dev
    zlib-dev: zlib1g-dev
    mariadb-dev: default-libmysqlclient-dev
    bind-tools: dnsutils
    iputils: iputils-ping
    sqlite: sqlite3

# ---------------------------------------------------------------------------
# openclaw — Full-featured Debian + Python venv + Node.js
