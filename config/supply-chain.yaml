    - postgresql-client
    - sqlite3
    - libsqlite3-dev
    - nginx
    - ffmpeg
    - imagemagick
    - graphviz
    - tesseract-ocr
    - poppler-utils
    - wkhtmltopdf
    - chromium
    - gcc
    - g++
    - make
    - cmake
    - libffi-dev
    - libssl-dev
    - libxml2-dev
    - libxslt1-dev
    - libjpeg-dev
    - libpng-dev
    - zlib1g-dev
    - libpq-dev
    - default-libmysqlclient-dev
    - curl
    - wget
    - git
    - jq
    - zip
    - unzip

  npm:
    - express
    - typescript
    - ts-node
    - prettier
