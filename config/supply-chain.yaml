    - numpy
    - scipy
    - matplotlib
    - seaborn
    - plotly
    - pillow
    # Databases
    - sqlalchemy
    - psycopg2-binary
    - pymongo
    - redis
    - sqlite-utils
    - aiosqlite
    # Utilities
    - pyyaml
    - toml
    - python-dotenv
    - click
    - rich
    - jinja2
    - pydantic
    - marshmallow
    # PDF / document
    - reportlab
    - fpdf2
    - weasyprint
    - pdfkit
    - python-docx
    - openpyxl
    # Crypto / auth
    - cryptography
    - pyjwt
    - bcrypt
    - passlib
    # Testing
    - pytest
    - coverage
    # Scraping / parsing
    - beautifulsoup4
    - lxml
    - html5lib
    - scrapy
    # ML (lightweight)
    - scikit-learn
    - joblib
    # Misc
    - celery
    - boto3
